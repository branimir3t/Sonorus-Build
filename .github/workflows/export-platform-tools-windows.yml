name: Export Windows Platform Tools
on:
  push:
    paths:
      - '.github/workflows/export-platform-tools-windows.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Android Platform Tools for Windows
        run: |
          curl -fL --retry 3 -o platform-tools-latest-windows.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -t platform-tools-latest-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: platform-tools-windows
          path: platform-tools-latest-windows.zip
          if-no-files-found: error
