name: Build Sonorus APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Sonorus source
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -1)"
          test -n "$ZIP"
          rm -rf source
          mkdir source
          unzip -q "$ZIP" -d source
          PROJECT_DIR="$(find source -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" Sonorus-v0.3.11.14-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonorus-v0.3.11.14-debug-apk
          path: Sonorus-v0.3.11.14-debug.apk
          if-no-files-found: error
