name: Build Sonorus APK

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Sonorus source
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -1)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d source
          echo "PROJECT_DIR=$(find source -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" Sonorus-v0.3.11.14-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonorus-v0.3.11.14-debug-apk
          path: Sonorus-v0.3.11.14-debug.apk
          if-no-files-found: error
