name: Export AAPT2
on:
  push:
    paths:
      - '.github/workflows/export-aapt2.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK 35
        run: yes | sdkmanager 'build-tools;35.0.0'
      - name: Collect aapt2
        run: |
          mkdir out
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" out/aapt2
          chmod +x out/aapt2
      - uses: actions/upload-artifact@v4
        with:
          name: android-aapt2-35
          path: out/aapt2
          if-no-files-found: error
